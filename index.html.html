<script>
const data=window.MENU_DATA||{items:[]};
const cats=[...new Set(data.items.map(x=>x.category))];let active=cats[0];
document.getElementById('brand').textContent=data.brand||'Pulse Healthy Food';document.getElementById('tagline').textContent=data.tagline||'';
function renderTabs(){document.getElementById('tabs').innerHTML=cats.map(c=>`<button class="${c===active?'active':''}" onclick="active='${c.replaceAll("'","\\'")}';renderTabs();render()">${c}</button>`).join('')}
function render(){const items=data.items.filter(x=>x.category===active);document.getElementById('menu').innerHTML=items.length?items.map(x=>`<article class="card"><div class="pic">${x.image?`<img src="${x.image}" alt="${esc(x.name)}">`:'<div class="placeholder">🍽️</div>'}</div><div class="body"><div class="row"><div><div class="name">${esc(x.name)}</div><div class="id">${x.id}</div></div><div class="price">${esc(x.price)} ${data.currency||'SAR'}</div></div></div></article>`).join(''):'<div class="empty">No items in this category.</div>'}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
renderTabs();render();
</script></body></html>
